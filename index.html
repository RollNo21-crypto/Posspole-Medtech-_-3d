    <script>
      // Enhanced SEO tracking and optimization
      (function() {
        'use strict';
        
        // Track page performance for SEO
        function trackPagePerformance() {
          if ('PerformanceObserver' in window) {
            const observer = new PerformanceObserver((list) => {
              const entries = list.getEntries();
              entries.forEach(entry => {
                if (entry.entryType === 'navigation') {
                  // Track page load time
                  const loadTime = entry.loadEventEnd - entry.loadEventStart;
                  if (window.gtag && loadTime > 0) {
                    gtag('event', 'page_load_time', {
                      event_category: 'Performance',
                      event_label: 'POSSPOLE MEDTECH',
                      value: Math.round(loadTime)
                    });
                  }
                }
              });
            });
            observer.observe({ entryTypes: ['navigation'] });
          }
        }
        
        // Track user engagement for SEO signals
        function trackEngagement() {
          let engagementTime = 0;
          let isActive = true;
          
          // Track time on page
          const startTime = Date.now();
          
          // Track scroll depth
          let maxScroll = 0;
          function trackScroll() {
            const scrollPercent = Math.round(
              (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100
            );
            if (scrollPercent > maxScroll) {
              maxScroll = scrollPercent;
            }
          }
          
          window.addEventListener('scroll', trackScroll, { passive: true });
          
          // Track when user leaves
          window.addEventListener('beforeunload', () => {
            const timeOnPage = Math.round((Date.now() - startTime) / 1000);
            
            if (window.gtag && timeOnPage > 5) {
              gtag('event', 'engagement_time', {
                event_category: 'Engagement',
                event_label: 'POSSPOLE MEDTECH',
                value: timeOnPage
              });
              
              gtag('event', 'scroll_depth', {
                event_category: 'Engagement',
                event_label: 'POSSPOLE MEDTECH',
                value: maxScroll
              });
            }
          });
        }
        
        // Initialize tracking when page is loaded
        if (document.readyState === 'complete') {
          trackPagePerformance();
          trackEngagement();
        } else {
          window.addEventListener('load', () => {
            trackPagePerformance();
            trackEngagement();
          });
